<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 609" width="300" height="609" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">The NextUp popover</title>
  <desc id="hero-desc">A 300-point menu bar popover showing the date and event summary, a month calendar for August 2026 with the current week highlighted and coloured event dots, and an agenda listing an overdue reminder, a meeting, and tomorrow's first event.</desc>

  <defs>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .pri { fill: #2B2B2D; }
      .sec { fill: #8E9196; }
      .ter { fill: #C2C5C9; }
      .quad { fill: #D2D5D9; }
      .acc { fill: #268BD2; }
    </style>
    <clipPath id="card"><rect x="0" y="0" width="300" height="609" rx="15" ry="15"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect x="0" y="0" width="300" height="609" fill="#FFFFFF"/>

    <!-- ============ HEADER ============ -->
    <!-- moon.fill, time-of-day glyph -->
    <path d="M22.6 30.1A6.2 6.2 0 0114.4 21.9 6.4 6.4 0 1022.6 30.1Z" fill="#5F55EC"/>
    <text class="f pri" x="29.5" y="33.3" font-size="15" font-weight="600">Mon, Aug 10</text>

    <!-- header buttons: plus, magnifier, chevron.down, gear -->
    <g stroke="#6E7176" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <g transform="translate(192.5,22)" stroke-width="1.6">
        <path d="M5.5 0V11M0 5.5H11"/>
      </g>
      <g transform="translate(217.5,22)">
        <circle cx="4.9" cy="4.9" r="3.7" stroke-width="1.5"/>
        <path d="M7.7 7.7L11.5 11.5" stroke-width="1.7"/>
      </g>
      <g transform="translate(244.5,24.5)" stroke-width="1.7">
        <path d="M0 0L5.75 5.6L11.5 0"/>
      </g>
      <g transform="translate(269,20.5)" stroke-width="1.4">
        <circle cx="7" cy="7" r="2.4"/>
        <circle cx="7" cy="7" r="5"/>
        <path d="M7 0.7v1.3M7 12v1.3M0.7 7h1.3M12 7h1.3M2.6 2.6l0.9 0.9M10.5 10.5l0.9 0.9M11.4 2.6l-0.9 0.9M3.5 10.5l-0.9 0.9"/>
      </g>
    </g>

    <text class="f sec" x="12.5" y="59" font-size="12.8">1 event, 1 overdue reminder</text>

    <rect x="0" y="72" width="300" height="1" fill="#E6E6E6"/>

    <!-- ============ CALENDAR ============ -->
    <text class="f pri" x="12.5" y="98.7" font-size="18" font-weight="600" letter-spacing="-0.2">August 2026</text>
    <g stroke="#6E7176" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M246.5 88L240.5 94L246.5 100"/>
      <path d="M273.5 88L279.5 94L273.5 100"/>
    </g>

    <!-- weekday initials -->
    <g class="f ter" font-size="10" font-weight="500" text-anchor="middle">
      <text x="48.5" y="128">S</text>
      <text x="85.6" y="128">M</text>
      <text x="122.7" y="128">T</text>
      <text x="159.8" y="128">W</text>
      <text x="196.9" y="128">T</text>
      <text x="234" y="128">F</text>
      <text x="271.1" y="128">S</text>
    </g>

    <!-- current-week highlight capsule -->
    <rect x="32" y="209.25" width="255.5" height="31.5" rx="15.75" fill="#2B2B2D" fill-opacity="0.075"/>

    <!-- week numbers -->
    <g class="f quad" font-size="9" text-anchor="middle">
      <text x="21.5" y="153.4">31</text>
      <text x="21.5" y="192.4">32</text>
      <text x="21.5" y="231.4">33</text>
      <text x="21.5" y="270.4">34</text>
      <text x="21.5" y="309.4">35</text>
      <text x="21.5" y="348.4">36</text>
    </g>

    <!-- today (also the selected day): 27.5pt accent circle -->
    <circle cx="85.6" cy="225" r="13.75" fill="#268BD2"/>

    <!-- day numerals -->
    <g class="f" font-size="15" text-anchor="middle">
      <!-- week 1: Jul 26-31, Aug 1 -->
      <g fill="#C2C5C9">
        <text x="48.5" y="153.4">26</text><text x="85.6" y="153.4">27</text><text x="122.7" y="153.4">28</text>
        <text x="159.8" y="153.4">29</text><text x="196.9" y="153.4">30</text><text x="234" y="153.4">31</text>
      </g>
      <text x="271.1" y="153.4" fill="#2B2B2D">1</text>
      <!-- week 2 -->
      <g fill="#2B2B2D">
        <text x="48.5" y="192.4">2</text><text x="85.6" y="192.4">3</text><text x="122.7" y="192.4">4</text>
        <text x="159.8" y="192.4">5</text><text x="196.9" y="192.4">6</text><text x="234" y="192.4">7</text>
        <text x="271.1" y="192.4">8</text>
      </g>
      <!-- week 3 — the current week -->
      <g fill="#2B2B2D">
        <text x="48.5" y="231.4">9</text>
        <text x="85.6" y="231.4" fill="#FFFFFF" font-weight="600">10</text>
        <text x="122.7" y="231.4">11</text><text x="159.8" y="231.4">12</text><text x="196.9" y="231.4">13</text>
        <text x="234" y="231.4">14</text><text x="271.1" y="231.4">15</text>
      </g>
      <!-- week 4 -->
      <g fill="#2B2B2D">
        <text x="48.5" y="270.4">16</text><text x="85.6" y="270.4">17</text><text x="122.7" y="270.4">18</text>
        <text x="159.8" y="270.4">19</text><text x="196.9" y="270.4">20</text><text x="234" y="270.4">21</text>
        <text x="271.1" y="270.4">22</text>
      </g>
      <!-- week 5 -->
      <g fill="#2B2B2D">
        <text x="48.5" y="309.4">23</text><text x="85.6" y="309.4">24</text><text x="122.7" y="309.4">25</text>
        <text x="159.8" y="309.4">26</text><text x="196.9" y="309.4">27</text><text x="234" y="309.4">28</text>
        <text x="271.1" y="309.4">29</text>
      </g>
      <!-- week 6: Aug 30-31, Sep 1-5 -->
      <g fill="#2B2B2D">
        <text x="48.5" y="348.4">30</text><text x="85.6" y="348.4">31</text>
      </g>
      <g fill="#C2C5C9">
        <text x="122.7" y="348.4">1</text><text x="159.8" y="348.4">2</text><text x="196.9" y="348.4">3</text>
        <text x="234" y="348.4">4</text><text x="271.1" y="348.4">5</text>
      </g>
    </g>

    <!-- event dots, in each calendar's own colour -->
    <g>
      <circle cx="48.5" cy="164" r="1.75" fill="#FF9500"/>
      <circle cx="271.1" cy="164" r="1.75" fill="#1BADF8"/>

      <circle cx="79.6" cy="242" r="1.75" fill="#FF9500"/>
      <circle cx="85.6" cy="242" r="1.75" fill="#FF9500"/>
      <circle cx="91.6" cy="242" r="1.75" fill="#FF9500"/>
      <circle cx="122.7" cy="242" r="1.75" fill="#34C759"/>
      <circle cx="271.1" cy="242" r="1.75" fill="#1BADF8"/>

      <circle cx="122.7" cy="320" r="1.75" fill="#34C759"/>

      <circle cx="159.8" cy="359" r="1.75" fill="#1BADF8"/>
    </g>

    <rect x="0" y="380" width="300" height="1" fill="#E6E6E6"/>

    <!-- ============ AGENDA ============ -->
    <text class="f acc" x="19" y="403.5" font-size="9.5" font-weight="600" letter-spacing="1.35">TODAY</text>

    <!-- All / Events / Reminders filter -->
    <rect x="137" y="391" width="26" height="15" rx="7.5" fill="#268BD2"/>
    <g class="f" font-size="11" text-anchor="middle">
      <text x="150" y="402.5" font-size="10.5" fill="#FFFFFF" font-weight="600">All</text>
      <text x="187.25" y="403.5" fill="#808387">Events</text>
      <text x="243.25" y="403.5" fill="#808387">Reminders</text>
    </g>

    <!-- Row A — overdue reminder -->
    <text class="m sec" x="32.5" y="431.5" font-size="9.5">10:30pm</text>
    <rect x="75" y="422" width="45" height="12" rx="6" fill="#FF3B30"/>
    <text class="f" x="97.5" y="431" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">Overdue</text>
    <text class="f" x="124.5" y="431.5" font-size="10" font-weight="700" fill="#FF3B30" letter-spacing="0.6">!!!</text>
    <circle cx="17" cy="445.5" r="7.5" fill="none" stroke="#9A9DA2" stroke-width="1.5"/>
    <text class="f pri" x="32.5" y="451" font-size="13.4" font-weight="600">Send the Q3 numbers to Dana</text>

    <!-- Row B — meeting -->
    <rect x="8" y="468" width="2.5" height="27.5" rx="1.25" fill="#1BADF8"/>
    <text class="m sec" x="19.5" y="476" font-size="9.5">10&#8211;11:15pm</text>
    <!-- video glyph -->
    <g transform="translate(80,468.5)" fill="none" stroke="#268BD2" stroke-width="1.3" stroke-linejoin="round">
      <rect x="0.65" y="0.65" width="7.2" height="6.2" rx="1.6"/>
      <path d="M8.4 2.6L10.6 1.1V6.4L8.4 4.9Z" fill="#268BD2" stroke="none"/>
    </g>
    <text class="f pri" x="19.5" y="493.6" font-size="13.8" font-weight="500">Design review</text>

    <!-- Tomorrow -->
    <text class="f sec" x="19" y="531.5" font-size="9.5" font-weight="600" letter-spacing="1.35">TOMORROW</text>

    <!-- Row C — tomorrow's first event -->
    <rect x="8" y="549" width="2.5" height="29.5" rx="1.25" fill="#34C759"/>
    <text class="m sec" x="19.5" y="557.5" font-size="9.5">1&#8211;2am</text>
    <!-- repeat glyph -->
    <g transform="translate(52,549.5)" fill="none" stroke="#8E9196" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0.8 3.1A3.2 3.2 0 016.9 2.4"/>
      <path d="M8 0.6V2.7H5.9"/>
      <path d="M8.2 4.9A3.2 3.2 0 012.1 5.6"/>
      <path d="M1 7.4V5.3H3.1"/>
    </g>
    <text class="f" x="276" y="557.5" font-size="11.4" font-weight="500" fill="#34C759" text-anchor="end">in 1h 28m</text>
    <text class="f pri" x="19.5" y="576.7" font-size="13.2" font-weight="500">1:1 with Priya</text>

    <!-- overlay scroller -->
    <rect x="286" y="385" width="10.5" height="202.5" rx="5.25" fill="#F2F2F2"/>
    <rect x="286" y="385" width="10.5" height="152.5" rx="5.25" fill="#7A7A7A"/>

    <!-- resize thumb -->
    <rect x="133.75" y="597" width="32.5" height="3.5" rx="1.75" fill="#E0E1E3"/>
  </g>

  <rect x="0.5" y="0.5" width="299" height="608" rx="14.5" fill="none" stroke="#D5D7DC"/>
</svg>
