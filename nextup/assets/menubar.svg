<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="560" height="140" role="img" aria-labelledby="mb-title mb-desc">
  <title id="mb-title">NextUp in the macOS menu bar</title>
  <desc id="mb-desc">The macOS menu bar showing the NextUp item as a calendar glyph with the date "Sat, Feb 7", and an optional second item reading "Standup in 45m".</desc>

  <defs>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4E6FA8"/>
      <stop offset="0.55" stop-color="#6E5FA8"/>
      <stop offset="1" stop-color="#9A6E9E"/>
    </linearGradient>
    <clipPath id="deskclip"><rect x="0" y="0" width="560" height="140" rx="10"/></clipPath>
  </defs>

  <g clip-path="url(#deskclip)">
    <rect width="560" height="140" fill="url(#desk)"/>
    <rect width="560" height="28" fill="#FFFFFF" fill-opacity="0.82"/>

    <!-- left: apple menu + app menus -->
    <g fill="#2B2B2D">
      <path d="M20.6 12.5c-.1-1.5 1.2-2.2 1.3-2.3-.7-1-1.8-1.2-2.2-1.2-1-.1-1.9.6-2.4.6s-1.2-.6-2-.6c-1 0-2 .6-2.5 1.5-1.1 1.9-.3 4.6.8 6.1.5.7 1.1 1.6 1.9 1.5.8 0 1-.5 2-.5s1.1.5 2 .5c.8 0 1.3-.7 1.8-1.4.6-.8.8-1.6.8-1.6s-1.5-.6-1.5-2.6z"/>
      <path d="M18.6 7.6c.4-.5.7-1.2.6-1.9-.6 0-1.4.4-1.8 1-.4.5-.7 1.2-.6 1.9.7.1 1.4-.4 1.8-1z"/>
    </g>
    <g class="f" fill="#2B2B2D" font-size="11.5">
      <text x="34" y="18" font-weight="700">Finder</text>
      <text x="76" y="18">File</text>
      <text x="102" y="18">Edit</text>
      <text x="130" y="18">View</text>
      <text x="162" y="18">Go</text>
    </g>

    <!-- countdown status item -->
    <rect x="222" y="3" width="106" height="22" rx="5" fill="#FFFFFF" fill-opacity="0.55"/>
    <text class="f" x="232" y="18" fill="#2B2B2D" font-size="11.5">Standup in 45m</text>

    <!-- NextUp status item: "10.calendar" glyph + date -->
    <rect x="336" y="3" width="102" height="22" rx="5" fill="#FFFFFF" fill-opacity="0.55"/>
    <g transform="translate(344,6)">
      <rect x="0" y="1.4" width="15" height="14" rx="3" fill="none" stroke="#2B2B2D" stroke-width="1.3"/>
      <path d="M0 5.6H15" stroke="#2B2B2D" stroke-width="1.3"/>
      <path d="M4 0V2.8M11 0V2.8" stroke="#2B2B2D" stroke-width="1.3" stroke-linecap="round"/>
      <text class="f" x="7.5" y="13" font-size="7" font-weight="700" fill="#2B2B2D" text-anchor="middle">10</text>
    </g>
    <text class="f" x="366" y="18" fill="#2B2B2D" font-size="11.5">Sat, Feb 7</text>

    <!-- system items -->
    <g stroke="#2B2B2D" fill="none" stroke-width="1.3" stroke-linecap="round">
      <path d="M452 17.5a7 7 0 0110 0" />
      <path d="M455 20.5a3.6 3.6 0 014 0"/>
    </g>
    <circle cx="457" cy="23.5" r="1.1" fill="#2B2B2D"/>
    <g transform="translate(474,9)">
      <rect x="0" y="0" width="18" height="10" rx="3" fill="none" stroke="#2B2B2D" stroke-width="1.2"/>
      <rect x="1.6" y="1.6" width="11" height="6.8" rx="1.6" fill="#2B2B2D"/>
      <path d="M19.4 3.6v2.8" stroke="#2B2B2D" stroke-width="1.6" stroke-linecap="round"/>
    </g>
    <text class="f" x="546" y="18" fill="#2B2B2D" font-size="11.5" text-anchor="end">9:41 AM</text>

    <!-- numbered callouts -->
    <g stroke="#FFFFFF" stroke-opacity="0.7" stroke-width="1.2" stroke-dasharray="3 3">
      <path d="M387 29V40"/>
      <path d="M275 29V40"/>
    </g>
    <g fill="#FFFFFF">
      <circle cx="387" cy="49" r="9"/>
      <circle cx="275" cy="49" r="9"/>
      <circle cx="32" cy="87" r="11"/>
      <circle cx="32" cy="118" r="11"/>
    </g>
    <g class="f" font-weight="700" fill="#4A4E8C" text-anchor="middle">
      <text x="387" y="52.7" font-size="10.5">1</text>
      <text x="275" y="52.7" font-size="10.5">2</text>
      <text x="32" y="91.5" font-size="13">1</text>
      <text x="32" y="122.5" font-size="13">2</text>
    </g>
    <g class="f" fill="#FFFFFF" font-size="14.5">
      <text x="52" y="92"><tspan font-weight="600">Click to open NextUp</tspan><tspan fill-opacity="0.82"> &#8212; today&#8217;s date, right in the menu bar</tspan></text>
      <text x="52" y="123"><tspan font-weight="600">Your next event, always visible</tspan><tspan fill-opacity="0.82"> &#8212; counts down; click to join</tspan></text>
    </g>
  </g>
</svg>
