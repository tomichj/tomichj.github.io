<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 236" width="300" height="236" role="img" aria-labelledby="ag-title ag-desc">
  <title id="ag-title">Events and reminders in one agenda</title>
  <desc id="ag-desc">An agenda section headed TODAY, with an overdue reminder that has a checkbox, a meeting in progress with a Join button and a "25m left" chip, a now divider, and an upcoming event.</desc>

  <defs>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .pri { fill: #2B2B2D; }
      .sec { fill: #6E7176; }
    </style>
    <clipPath id="agclip"><rect x="0" y="0" width="300" height="236" rx="12"/></clipPath>
  </defs>

  <g clip-path="url(#agclip)">
    <rect width="300" height="236" fill="#FFFFFF"/>

    <text class="f" x="19" y="24" font-size="10" font-weight="600" letter-spacing="1.2" fill="#268BD2">TODAY</text>
    <rect x="151" y="13.5" width="29" height="17" rx="8.5" fill="#268BD2"/>
    <g class="f" font-size="9" font-weight="600" text-anchor="middle">
      <text x="165.5" y="25" fill="#FFFFFF">All</text>
      <text x="205" y="25" fill="#6E7176">Events</text>
      <text x="259" y="25" fill="#6E7176">Reminders</text>
    </g>

    <!-- overdue reminder floats to the top of Today -->
    <circle cx="16" cy="52" r="6.5" fill="none" stroke="#A9ADB3" stroke-width="1.4"/>
    <text class="m sec" x="28" y="51" font-size="9" font-weight="500">9:00am</text>
    <rect x="63" y="43" width="38" height="11" rx="5.5" fill="#FF3B30"/>
    <text class="f" x="82" y="51.2" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">Overdue</text>
    <text class="f" x="106" y="51.4" font-size="8" font-weight="800" fill="#FF3B30">!!</text>
    <text class="f pri" x="28" y="67" font-size="12" font-weight="500">Send the Q3 numbers to Dana</text>

    <!-- completed reminder -->
    <g transform="translate(9.5,79.5)">
      <circle cx="6.5" cy="6.5" r="6.5" fill="#268BD2"/>
      <path d="M3.4 6.6L5.6 8.8L9.7 4.4" fill="none" stroke="#FFFFFF" stroke-width="1.5"
            stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text class="f" x="28" y="90" font-size="12" font-weight="400" fill="#A0A3A8"
          text-decoration="line-through">Book the offsite room</text>

    <!-- in-progress meeting -->
    <rect x="1" y="102" width="298" height="52" rx="6" fill="#1BADF8" fill-opacity="0.10"
          stroke="#1BADF8" stroke-opacity="0.75" stroke-width="1.5"/>
    <rect x="8" y="109" width="3" height="38" rx="1.5" fill="#1BADF8"/>
    <text class="m sec" x="19" y="118" font-size="9" font-weight="500">10-11am</text>
    <g transform="translate(63,111)" fill="#2E7BD6">
      <rect x="0" y="1.2" width="6.4" height="5.4" rx="1.4"/>
      <path d="M7.2 3L9.8 1.4V6.4L7.2 4.8Z"/>
    </g>
    <g transform="translate(78,111)" fill="none" stroke="#8A8E94" stroke-width="0.9" stroke-linejoin="round">
      <path d="M1.4 5.8C1.4 3.4 2.3 1.6 4 1.6S6.6 3.4 6.6 5.8L7.4 6.9H0.6Z"/>
      <path d="M3 8.1a1 1 0 002 0" stroke-linecap="round"/>
    </g>
    <rect x="212" y="110" width="26" height="13" rx="6.5" fill="#268BD2"/>
    <text class="f" x="225" y="119.2" font-size="8" font-weight="600" fill="#FFFFFF" text-anchor="middle">Join</text>
    <rect x="242" y="110" width="42" height="13" rx="4" fill="#268BD2" fill-opacity="0.2"/>
    <text class="f" x="263" y="119.2" font-size="8" font-weight="500" fill="#268BD2" text-anchor="middle">25m left</text>
    <text class="f pri" x="19" y="135" font-size="12" font-weight="500">Design review</text>
    <g transform="translate(19,141)" fill="#8A8E94">
      <path d="M3.4 0C1.5 0 0 1.5 0 3.4 0 5.9 3.4 9.4 3.4 9.4S6.8 5.9 6.8 3.4C6.8 1.5 5.3 0 3.4 0Z"/>
      <circle cx="3.4" cy="3.4" r="1.3" fill="#FFFFFF"/>
    </g>
    <text class="f sec" x="29" y="148" font-size="10" font-weight="500">Zoom &#183; Conference Room B</text>

    <!-- now divider -->
    <g fill="#268BD2">
      <circle cx="11" cy="168" r="3"/>
      <circle cx="289" cy="168" r="3"/>
      <rect x="11" y="167.25" width="278" height="1.5"/>
    </g>

    <!-- next upcoming -->
    <rect x="8" y="183" width="3" height="24" rx="1.5" fill="#34C759"/>
    <text class="m sec" x="19" y="190" font-size="9" font-weight="500">2-3pm</text>
    <g transform="translate(55,183)" fill="none" stroke="#8A8E94" stroke-width="0.9"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M0.8 3.4A3 3 0 016.6 2.6"/><path d="M7.6 0.6V2.8H5.4"/>
      <path d="M7.6 5A3 3 0 011.8 5.8"/><path d="M0.8 7.8V5.6H3"/>
    </g>
    <text class="f" x="284" y="190.4" font-size="10" font-weight="500" fill="#34C759" text-anchor="end">in 2h</text>
    <text class="f pri" x="19" y="206" font-size="12" font-weight="500">1:1 with Priya</text>

    <!-- undated reminder sinks to the bottom -->
    <circle cx="16" cy="222" r="6.5" fill="none" stroke="#A9ADB3" stroke-width="1.4"/>
    <text class="f pri" x="28" y="226" font-size="12" font-weight="500">Renew the domain</text>
  </g>
  <rect x="0.5" y="0.5" width="299" height="235" rx="11.5" fill="none" stroke="#E1E3E7"/>
</svg>
