<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" width="300" height="160" role="img" aria-labelledby="tz-title tz-desc">
  <title id="tz-title">The time zone strip</title>
  <desc id="tz-desc">Four tracked time zones — Cupertino, New York, London and Tokyo — each with a time-of-day icon, the local time, the UTC offset and the local day.</desc>

  <defs>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .pri { fill: #2B2B2D; }
      .sec { fill: #6E7176; }
    </style>
    <clipPath id="tzclip"><rect x="0" y="0" width="300" height="160" rx="12"/></clipPath>

    <g id="sunmax" fill="#F5B301">
      <circle cx="7" cy="7" r="3.1"/>
      <g stroke="#F5B301" stroke-width="1.5" stroke-linecap="round">
        <path d="M7 0.5V2.3M7 11.7v1.8M0.5 7h1.8M11.7 7h1.8M2.4 2.4l1.3 1.3M10.3 10.3l1.3 1.3M11.6 2.4l-1.3 1.3M3.7 10.3l-1.3 1.3"/>
      </g>
    </g>
    <g id="sunset" fill="none" stroke="#F08A24" stroke-width="1.5" stroke-linecap="round">
      <path d="M2.5 9.5a4.5 4.5 0 019 0"/>
      <path d="M0.6 9.5h12.8"/>
      <path d="M7 0.6v2.2M1.9 2.6l1.3 1.3M12.1 2.6l-1.3 1.3"/>
    </g>
    <g id="moon" fill="#5B5FD6">
      <path d="M10.6 8.4A5.4 5.4 0 014 1.8 5.6 5.6 0 1010.6 8.4Z"/>
    </g>
    <g id="sunrise" fill="none" stroke="#F08A24" stroke-width="1.5" stroke-linecap="round">
      <path d="M2.5 9.5a4.5 4.5 0 019 0"/>
      <path d="M0.6 12.2h12.8"/>
      <path d="M7 4.4V0.8M4.6 2.4L7 0.8l2.4 1.6"/>
    </g>
  </defs>

  <g clip-path="url(#tzclip)">
    <rect width="300" height="160" fill="#FFFFFF"/>

    <!-- Cupertino -->
    <use href="#sunmax" x="11" y="12"/>
    <text class="f pri" x="36" y="20" font-size="12" font-weight="600">Cupertino</text>
    <text class="m sec" x="288" y="20" font-size="12" font-weight="500" text-anchor="end">10:41 AM</text>
    <text class="f sec" x="36" y="32" font-size="10">GMT-7</text>
    <text class="f sec" x="288" y="32" font-size="10" text-anchor="end">Today, Monday</text>

    <!-- New York -->
    <use href="#sunmax" x="11" y="48"/>
    <text class="f pri" x="36" y="56" font-size="12" font-weight="600">New York</text>
    <text class="m sec" x="288" y="56" font-size="12" font-weight="500" text-anchor="end">1:41 PM</text>
    <text class="f sec" x="36" y="68" font-size="10">GMT-4</text>
    <text class="f sec" x="288" y="68" font-size="10" text-anchor="end">Today, Monday</text>

    <!-- London -->
    <use href="#sunset" x="11" y="84"/>
    <text class="f pri" x="36" y="92" font-size="12" font-weight="600">London</text>
    <text class="m sec" x="288" y="92" font-size="12" font-weight="500" text-anchor="end">6:41 PM</text>
    <text class="f sec" x="36" y="104" font-size="10">GMT+1</text>
    <text class="f sec" x="288" y="104" font-size="10" text-anchor="end">Today, Monday</text>

    <!-- Tokyo -->
    <use href="#moon" x="11" y="120"/>
    <text class="f pri" x="36" y="128" font-size="12" font-weight="600">Tokyo</text>
    <text class="m sec" x="288" y="128" font-size="12" font-weight="500" text-anchor="end">2:41 AM</text>
    <text class="f sec" x="36" y="140" font-size="10">GMT+9</text>
    <text class="f sec" x="288" y="140" font-size="10" text-anchor="end">Tomorrow, Tuesday</text>
  </g>
  <rect x="0.5" y="0.5" width="299" height="159" rx="11.5" fill="none" stroke="#E1E3E7"/>
</svg>
