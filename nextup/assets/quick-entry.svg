<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 379" width="420" height="379" role="img" aria-labelledby="qe-title qe-desc">
  <title id="qe-title">Natural-language quick entry</title>
  <desc id="qe-desc">The event editor with the sentence "Lunch with Sam tomorrow 1pm at Cafe Rio" typed in. Underneath, the parsed date, time and place are read back, and the date, repeat and location fields have been filled in automatically.</desc>

  <defs>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif; }
      .pri { fill: #2B2B2D; }
      .sec { fill: #868A8E; }
      .ter { fill: #757779; }
      .acc { fill: #268BD2; }
    </style>
    <clipPath id="qeclip"><rect x="0" y="0" width="420" height="379" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#qeclip)">
    <rect width="420" height="379" fill="#E9E9E9"/>

    <!-- ============ Event / Reminder segmented control ============ -->
    <rect x="18" y="13.5" width="220" height="27" rx="8" fill="#2B2B2D" fill-opacity="0.08"/>
    <rect x="19.5" y="15" width="109" height="24" rx="6.5" fill="#268BD2"/>
    <g transform="translate(51.3,20.5)" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round">
      <rect x="0.6" y="1.6" width="10.2" height="9.6" rx="2"/>
      <path d="M0.6 4.8H10.8"/>
      <path d="M3.3 0.8V2.4M8.1 0.8V2.4" stroke-linecap="round"/>
    </g>
    <text class="f" x="68" y="31.5" font-size="11.5" font-weight="600" fill="#FFFFFF">Event</text>
    <g transform="translate(149.7,21)" fill="none" stroke="#2B2B2D" stroke-width="1.2"
       stroke-linecap="round" stroke-linejoin="round">
      <circle cx="2" cy="2.4" r="1.9"/>
      <circle cx="2" cy="8.4" r="1.9"/>
      <path d="M6.4 2.4H11.3"/><path d="M6.4 8.4H11.3"/>
    </g>
    <text class="f pri" x="167.7" y="31.5" font-size="12">Reminder</text>
    <rect x="365.3" y="18" width="36.7" height="18.5" rx="6.5" fill="#2B2B2D" fill-opacity="0.07"/>
    <text class="f" x="383.6" y="31" font-size="10" font-weight="500" fill="#8E9095" text-anchor="middle">ESC</text>

    <!-- ============ the sentence, as typed ============ -->
    <text class="f pri" x="19.5" y="65.5" font-size="21">Lunch with Sam tomorrow 1pm at Cafe Rio<tspan
      fill="#268BD2" font-size="28" font-weight="200" dx="-3.5" dy="3">|</tspan></text>

    <!-- what NextUp read out of it -->
    <g transform="translate(19,78.5)" fill="none" stroke="#7C7F84" stroke-width="1.1" stroke-linejoin="round">
      <rect x="0.55" y="1.05" width="8.9" height="8.4" rx="1.8"/>
      <path d="M0.55 4H9.45"/>
      <path d="M2.9 0.5V1.6M7.1 0.5V1.6" stroke-linecap="round"/>
    </g>
    <text class="f sec" x="38" y="88.5" font-size="11.2">Tue, Aug 11, 1:00 PM</text>
    <g transform="translate(151.5,78.5)" fill="none" stroke="#7C7F84" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5" cy="3" r="2.4"/>
      <path d="M5 5.4V10.5"/>
      <path d="M1.6 10.5H8.4"/>
    </g>
    <text class="f sec" x="171" y="88.5" font-size="11.2">Cafe Rio</text>

    <!-- ============ resolved date and time ============ -->
    <text class="f" x="18.5" y="122.5" font-size="14.3">
      <tspan class="pri">Tomorrow</tspan><tspan fill="#A2A5A9" dx="8.5">&#183;</tspan><tspan class="acc" dx="8.5" font-weight="500">1:00 PM</tspan><tspan fill="#A2A5A9" dx="16">&#8594;</tspan><tspan class="acc" dx="11.5" font-weight="500">2:00 PM</tspan><tspan fill="#A2A5A9" dx="14.5">&#183;</tspan><tspan class="sec" dx="8.5">1h</tspan>
    </text>

    <!-- ============ repeat ============ -->
    <g transform="translate(21.5,148)" fill="none" stroke="#7C7F84" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0.9 4.2A4.2 4.2 0 019 3.2"/>
      <path d="M10.4 0.6V3.5H7.6"/>
      <path d="M11.1 6.6A4.2 4.2 0 013 7.6"/>
      <path d="M1.6 10.2V7.3H4.4"/>
    </g>
    <g fill="#2B2B2D" fill-opacity="0.08">
      <rect x="50" y="143" width="50" height="24" rx="8"/>
      <rect x="108" y="143" width="62" height="24" rx="8"/>
      <rect x="178" y="143" width="66.5" height="24" rx="8"/>
    </g>
    <g class="f pri" font-size="13.5" text-anchor="middle">
      <text x="75" y="159.8">Daily</text>
      <text x="139" y="159.8">Weekly</text>
      <text x="211.25" y="159.8">Monthly</text>
    </g>

    <!-- ============ location, filled in from the sentence ============ -->
    <g transform="translate(21.5,186)" fill="none" stroke="#7C7F84" stroke-width="1.2" stroke-linejoin="round">
      <path d="M11.2 0.9L0.9 5.4L5.3 7.1L7 11.5Z"/>
    </g>
    <text class="f pri" x="50.5" y="197.5" font-size="14.3">Cafe Rio</text>

    <!-- ============ empty fields ============ -->
    <g transform="translate(21.5,218) rotate(-45 6.5 6.75)" fill="none" stroke="#7C7F84" stroke-width="1.2">
      <rect x="0.6" y="4.45" width="7.4" height="4.6" rx="2.3"/>
      <rect x="5" y="4.45" width="7.4" height="4.6" rx="2.3"/>
    </g>
    <text class="f ter" x="51" y="228.5" font-size="14.3">Meeting link or URL</text>

    <g transform="translate(22.5,252)" fill="none" stroke="#7C7F84" stroke-width="1.2" stroke-linejoin="round">
      <path d="M1.3 7.8C1.3 4.4 2.5 2 4.9 2S8.5 4.4 8.5 7.8L9.8 9.4H0Z"/>
      <path d="M3.5 11.2a1.5 1.5 0 002.8 0" stroke-linecap="round"/>
      <path d="M4.9 0.6V2" stroke-linecap="round"/>
    </g>
    <text class="f ter" x="49" y="264" font-size="14.3">Add an alert</text>

    <g transform="translate(22,287.5)" fill="none" stroke="#7C7F84" stroke-width="1.2" stroke-linejoin="round">
      <rect x="0.6" y="0.6" width="10.8" height="10.8" rx="2"/>
      <path d="M3 4H9M3 6.5H9M3 9H6.5" stroke-linecap="round"/>
    </g>
    <text class="f ter" x="51" y="297" font-size="14.3">Notes, agenda, or prep</text>

    <!-- ============ footer ============ -->
    <rect x="0" y="320.5" width="420" height="1" fill="#2B2B2D" fill-opacity="0.14"/>
    <circle cx="22" cy="350.5" r="4.5" fill="#BB3ED9"/>
    <text class="f pri" x="38.5" y="355" font-size="15">Start</text>
    <rect x="297" y="333" width="106" height="35.5" rx="10" fill="#268BD2"/>
    <text class="f" x="313.5" y="355.9" font-size="14.6" font-weight="600" fill="#FFFFFF">Create</text>
    <text class="f" x="390" y="355.9" font-size="12.5" fill="#FFFFFF" fill-opacity="0.85" text-anchor="end">&#8984;&#8617;</text>
  </g>
  <rect x="0.5" y="0.5" width="419" height="378" rx="13.5" fill="none" stroke="#D3D3D3"/>
</svg>
